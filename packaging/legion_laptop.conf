# LenovoLegionLinux's legion_laptop alongside the mainline Lenovo drivers.
# The mainline drivers keep the power mode and power limits; legion_laptop
# adds fan curves, fan speeds and its switches without registering a second
# platform profile. The softdep loads the mainline drivers first so they bind
# the WMI devices both list. From LenovoLegionLinux's README.
options legion_laptop enable_platformprofile=0
softdep legion_laptop pre: ideapad_laptop lenovo_wmi_gamezone lenovo_wmi_other lenovo_wmi_events lenovo_wmi_capdata
